name: daily-report

on:
  schedule:
    - cron: '37 22 * * *'   # 07:37 KST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'public/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch external data → src/data/latest.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npx tsx scripts/fetch-data.ts

      - name: Astro build → dist/
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --commit-message를 SHA로 고정: git 커밋 메시지의 이모지/멀티바이트가
          # CF Pages deployment API에서 거부(code 8000111)되는 문제 영구 차단.
          # --commit-dirty: 빌드로 생성된 latest.json 등 미커밋 변경 경고 silence.
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main --commit-message=${{ github.sha }} --commit-dirty=true

      - name: Slack notify
        if: github.event_name != 'push' && success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: https://techboost.dev
        run: npx tsx scripts/send-slack.ts

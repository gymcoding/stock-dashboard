name: daily-report

on:
  # 매일 07:37 KST (22:37 UTC 전날) — 정시 트래픽 피크 회피
  schedule:
    - cron: '37 22 * * *'
  # GitHub Actions UI에서 "Run workflow" 수동 트리거
  workflow_dispatch: {}
  # main 푸시 시 자동 재배포 (코드/UI 변경 즉시 반영)
  push:
    branches: [main]
    paths:
      - 'dashboard.py'
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/daily.yml'

# B3: deploy-pages가 요구하는 권한
permissions:
  contents: read
  pages: write
  id-token: write

# M8: 동시 실행 충돌 방지 (예: 수동 트리거 + cron 겹칠 때)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish-and-notify:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      # B1/B2: index.html을 _site/에만 화이트리스트로 배포 (소스 노출 방지)
      - name: Build static site
        env:
          CI: 'true'
        run: |
          mkdir -p _site
          python dashboard.py --static --out _site/index.html --no-open
          # CNAME 파일이 있으면 _site/로 복사 (custom domain용)
          if [ -f CNAME ]; then cp CNAME _site/; fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Kakao daily report
        # push 트리거(코드 변경 재배포)에서는 카카오 알림 제외 — schedule/수동 실행에서만 발송
        if: github.event_name != 'push'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REFRESH_TOKEN: ${{ secrets.KAKAO_REFRESH_TOKEN }}
          SITE_URL: https://stock.gymcoding.co
          # M1: refresh_token 회전 시 자동 Secret 갱신 (선택, GH_PAT 등록 시만 동작)
          GH_PAT: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/send_kakao.py

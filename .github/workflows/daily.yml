name: daily-report

on:
  schedule:
    - cron: '37 22 * * *'   # 07:37 KST
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'astro.config.mjs'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'public/**'
      - '.github/workflows/daily.yml'

permissions:
  contents: read

concurrency:
  group: deploy-cf-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Fetch external data → src/data/latest.json
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: npx tsx scripts/fetch-data.ts

      - name: Astro build → dist/
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CF_PAGES_PROJECT }} --branch=main

      - name: Slack notify
        if: github.event_name != 'push' && success()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SITE_URL: https://techboost.dev
        run: npx tsx scripts/send-slack.ts
